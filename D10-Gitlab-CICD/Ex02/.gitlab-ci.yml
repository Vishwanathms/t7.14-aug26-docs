stages:
  - deploy

run-nginx:
  stage: deploy
  image: docker:24.0
  tags:
    - docker          # this must match the tag on your docker runner
  services:
    - docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker pull nginx:latest
    - docker run -d --name nginx-demo -p 8080:80 nginx:latest
    - sleep 5
    - docker ps
    - curl -s http://localhost:8080 | head -20
