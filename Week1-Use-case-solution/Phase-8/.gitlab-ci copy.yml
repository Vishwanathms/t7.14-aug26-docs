# CI pipeline for Phase 7 - three independent Spring Boot services, each with
# its own PostgreSQL database, plus an nginx frontend, wired together with
# docker compose.
#
# Paths in this file assume Phase-7/ is the repository root (GitLab reads
# .gitlab-ci.yml from wherever it lives, but job scripts run relative to the
# repository root by default). If this file instead lives inside a larger
# monorepo, either move it to the repo root and prefix every script line
# with `cd Phase-7 &&`, or set "CI/CD > General pipelines > CI/CD
# configuration file" to Phase-7/.gitlab-ci.yml in the GitLab project
# settings and add the same `cd Phase-7` prefix.
#
# Requires a runner with Docker available - either a shell/docker executor
# with the Docker CLI + compose plugin already on the host, or the
# docker:dind service enabled below.

stages:
  - build
  - integration-test

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  COMPOSE_PROJECT_NAME: phase7-ci

# ---------------------------------------------------------------------------
# build: compile each service on its own, independent of Docker.
# Catches a broken build in ~seconds instead of waiting for an image build.
# ---------------------------------------------------------------------------

.maven_build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd "$SERVICE_DIR"
    - mvn -q -DskipTests package
  artifacts:
    paths:
      - "$SERVICE_DIR/target/*.jar"
    expire_in: 1 hour

build:student-service:
  extends: .maven_build
  variables:
    SERVICE_DIR: student-service

build:course-service:
  extends: .maven_build
  variables:
    SERVICE_DIR: course-service

build:enrollment-service:
  extends: .maven_build
  variables:
    SERVICE_DIR: enrollment-service

# ---------------------------------------------------------------------------
# integration-test: build the actual images with docker compose, bring the
# whole stack up, run smoke tests against it through the same nginx origin
# a browser would use, then always tear the stack down.
# ---------------------------------------------------------------------------

integration-test:
  stage: integration-test
  image: docker:24-cli
  services:
    - docker:24-dind
  needs:
    - build:student-service
    - build:course-service
    - build:enrollment-service
  before_script:
    - apk add --no-cache curl bash
    - docker compose version
  script:
    - docker compose build
    - docker compose up -d
    - echo "Waiting for the stack to come up..."
    - sleep 15
    - docker compose ps
    - bash ci/smoke-test.sh
  after_script:
    - docker compose logs --tail=200 > compose-logs.txt || true
    - docker compose down -v || true
  artifacts:
    when: always
    paths:
      - compose-logs.txt
    expire_in: 3 days
