spring:
  application:
    name: enrollment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enrollment_db}
    username: ${DB_USERNAME:stumgmt}
    password: ${DB_PASSWORD:stumgmt}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

services:
  student-url: ${STUDENT_SERVICE_URL:http://localhost:8081}
  course-url: ${COURSE_SERVICE_URL:http://localhost:8082}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.enrollmentservice: DEBUG
