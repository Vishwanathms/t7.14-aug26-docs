spring:
  application:
    name: enrollment-service-test
  datasource:
    url: jdbc:h2:mem:enrollmentdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

services:
  student-url: http://localhost:0
  course-url: http://localhost:0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.enrollmentservice: DEBUG
