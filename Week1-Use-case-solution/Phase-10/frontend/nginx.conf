server {
    listen 80;

    # All API routing now lives in the gateway (see gateway-service's
    # application.yml). nginx no longer knows the three-service topology at
    # all - it just forwards /api/* to the one place that does.
    #
    # proxy_pass with a bare hostname resolves it once, at nginx startup, and
    # treats a failed lookup as fatal ("host not found in upstream") - fine
    # for Phase 8, where nginx was the first thing depending on already-up
    # services, but a real race now that nginx depends on the gateway
    # container's DNS entry propagating fast enough. Docker's embedded DNS
    # (127.0.0.11) is usually fast but not guaranteed instant, and this
    # crashed nginx intermittently during local verification of this exact
    # setup. Using an explicit resolver with a variable in proxy_pass makes
    # nginx resolve per-request instead of once at boot, so a slow-to-appear
    # gateway container delays the first few requests instead of taking
    # nginx down.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # No path after the variable, deliberately: with a variable in
        # proxy_pass, nginx does not rewrite the matched location prefix the
        # way it does for a static proxy_pass - it passes the original
        # request URI through unchanged. Adding a literal "/api/" here
        # truncates it instead (verified while fixing this).
        set $gateway_upstream gateway;
        proxy_pass http://$gateway_upstream:8080;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
